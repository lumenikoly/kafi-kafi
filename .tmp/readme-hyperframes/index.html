<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1600, height=1000" />
    <title>Kafi Kafi native UI captures</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #10131b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      .clip img { display: block; width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1600" data-height="1000" data-duration="12">
      <section id="connections" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <img id="connections-capture" src="assets/connections.png" alt="Native Kafi Kafi connection test" />
      </section>
      <section id="message-inspector" class="clip" data-start="4" data-duration="4" data-track-index="0">
        <img id="inspector-capture" src="assets/message-inspector.png" alt="Native Kafi Kafi record inspection" />
      </section>
      <section id="message-stream" class="clip" data-start="8" data-duration="4" data-track-index="0">
        <img id="stream-capture" src="assets/message-stream.png" alt="Native Kafi Kafi bounded message table" />
      </section>
    </div>
    <script>
      const timeline = gsap.timeline({ paused: true });
      timeline.to({}, { duration: 12 });
      window.__timelines["main"] = timeline;
    </script>
  </body>
</html>
