name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v1.0.0)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main and tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must run from main, got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z format, got $TAG" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (AppImage/DEB)
            os: ubuntu-latest
            artifact_name: linux-package
            artifact_path: |
              app-desktop/build/compose/binaries/main/appimage/*.AppImage
              app-desktop/build/compose/binaries/main/appimage/*.appimage
              app-desktop/build/compose/binaries/main/deb/*.deb
          - name: Windows (MSI)
            os: windows-latest
            artifact_name: windows-msi
            artifact_path: app-desktop/build/compose/binaries/main/msi/*.msi
            portable_archive: light-kafka-viewer-windows-portable.zip
          - name: macOS (DMG)
            os: macos-latest
            artifact_name: macos-dmg
            artifact_path: app-desktop/build/compose/binaries/main/dmg/*.dmg
            portable_archive: light-kafka-viewer-macos-portable.zip
    uses: ./.github/workflows/_reusable-package-build.yml
    with:
      target_name: ${{ matrix.name }}
      os: ${{ matrix.os }}
      artifact_name: ${{ matrix.artifact_name }}
      artifact_path: ${{ matrix.artifact_path }}
      portable_archive: ${{ matrix.portable_archive || '' }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: package
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mapfile -d '' release_assets < <(find dist -type f -print0)
          if (( ${#release_assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release create "$TAG" "${release_assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --fail-on-no-commits
