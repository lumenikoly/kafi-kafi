name: Tauri release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/tauri-check.yml
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node scripts/check-version.mjs "$GITHUB_REF_NAME"
  package:
    needs: [checks, validate-tag]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, target: x86_64-pc-windows-msvc, bundle: nsis, name: windows}
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, bundle: appimage, name: linux}
          - {os: macos-15-intel, target: x86_64-apple-darwin, bundle: dmg, name: macos-intel}
          - {os: macos-15, target: aarch64-apple-darwin, bundle: dmg, name: macos-arm64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf cmake perl libdbus-1-dev
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl cmake --yes --no-progress
          'C:\Strawberry\perl\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: rustup target add ${{ matrix.target }} --toolchain 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath src-tauri/target/${{ matrix.target }}/release/kafi-kafi.exe -DestinationPath src-tauri/target/${{ matrix.target }}/release/bundle/kafi-kafi-windows-portable.zip
      - run: node scripts/collect-artifacts.mjs src-tauri/target/${{ matrix.target }}/release/bundle artifacts/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/${{ matrix.name }}
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes $(find artifacts -type f)
