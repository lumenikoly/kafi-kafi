process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:19096
listeners=PLAINTEXT://0.0.0.0:19095,SASL_SSL://0.0.0.0:19094,CONTROLLER://0.0.0.0:19096
advertised.listeners=PLAINTEXT://127.0.0.1:19095,SASL_SSL://127.0.0.1:19094
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SSL:SASL_SSL
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
group.initial.rebalance.delay.ms=0
log.dirs=/tmp/kafka-logs
sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
listener.name.sasl_ssl.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required user_test-user="kafi-test-password";
listener.name.sasl_ssl.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_ssl.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_ssl.ssl.keystore.location=/etc/kafka/secrets/server.p12
listener.name.sasl_ssl.ssl.keystore.type=PKCS12
listener.name.sasl_ssl.ssl.keystore.password=kafi-test-keystore
listener.name.sasl_ssl.ssl.key.password=kafi-test-keystore
